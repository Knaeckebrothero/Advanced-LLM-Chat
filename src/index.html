<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Advanced LLM Chat</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Runtime environment configuration -->
  <script src="assets/env.js"></script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#eef3f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111518" media="(prefers-color-scheme: dark)">

  <!-- Security Headers as Meta Tags (fallback for when headers aren't set) -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- CSP meta tag as fallback - matches the backend CSP -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <!-- Fonts (Roboto, Inter, Material Icons) are bundled from npm packages, see angular.json "styles" -->
</head>
<body class="mat-typography">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
