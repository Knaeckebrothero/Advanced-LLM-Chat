<div class="metrics-container">
  <mat-form-field appearance="fill">
    <mat-label>{{ 'Summary' | translate }}</mat-label>
    <textarea matInput [(ngModel)]="summary" [placeholder]="'Summary' | translate"></textarea>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="refreshSummary()">{{ 'Refresh' | translate }}</button>

  <button mat-raised-button color="primary" (click)="updateSummary()">{{ 'Update Summary' | translate }}</button>
</div>
