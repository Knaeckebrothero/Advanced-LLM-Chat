<!-- Input field container with background visualization -->
<div #composer class="input-field-container" [class.recording-mode]="isRecording">
  <!-- Background waveform canvas (always present but only visible when recording).
       Its pixel size is set in code (updateCanvasDimensions), not bound here: it is measured after the first render. -->
  <canvas #waveformCanvas
          class="background-waveform-canvas"
          [class.hidden]="!isRecording"
          aria-hidden="true">
  </canvas>

  <!-- File preview area (shown when files are selected) -->
  <div class="file-preview-area" *ngIf="filePreviews.length > 0 && !isRecording">
    <a *ngFor="let preview of filePreviews"
       [href]="preview.type !== 'image' && preview.file ? createDownloadUrl(preview.file) : (preview.preview || '#')"
       [download]="preview.type !== 'image' && preview.file ? preview.name : null"
       (click)="onAttachmentClick($event, preview)"
       class="file-preview-item"
       [class.is-image]="preview.type === 'image'">

      <!-- Image preview -->
      <div class="file-thumbnail" *ngIf="preview.type === 'image' && preview.preview">
        <img [src]="preview.preview" [alt]="preview.name">
        <div class="file-info-overlay">
          {{ preview.name }}
        </div>
      </div>

      <!-- Icon for non-image files -->
      <div class="file-icon" *ngIf="preview.type !== 'image'">
        <mat-icon>{{ getFileIcon(preview.type) }}</mat-icon>
      </div>

      <!-- File info -->
      <div class="file-info" *ngIf="preview.type !== 'image'">
        <span class="file-name">{{ preview.name }}</span>
        <span class="file-size">{{ preview.sizeFormatted }}</span>
        <!-- Upload progress -->
        <div class="upload-progress" *ngIf="preview.uploadStatus === 'uploading'">
          <mat-progress-bar mode="determinate" [value]="preview.uploadProgress || 0" color="primary"></mat-progress-bar>
          <span class="progress-text">{{ preview.uploadProgress || 0 }}%</span>
        </div>
        <!-- Upload status indicators -->
        <div class="upload-status" *ngIf="preview.uploadStatus && preview.uploadStatus !== 'uploading'">
          <mat-icon *ngIf="preview.uploadStatus === 'completed'" class="status-completed">check_circle</mat-icon>
          <mat-icon *ngIf="preview.uploadStatus === 'failed'" class="status-failed">error</mat-icon>
          <mat-icon *ngIf="preview.uploadStatus === 'pending'" class="status-pending">schedule</mat-icon>
          <span *ngIf="preview.uploadStatus === 'failed'" class="error-message">{{ 'composer.uploadFailed' | translate }}</span>
          <span *ngIf="preview.uploadStatus === 'pending'" class="pending-message">{{ 'composer.uploading' | translate }}</span>
        </div>
      </div>

      <!-- Remove button -->
      <button mat-icon-button
              class="remove-file-button"
              (click)="removeFilePreview(preview.id); $event.preventDefault(); $event.stopPropagation()"
              [attr.aria-label]="'composer.removeFile' | translate: { name: preview.name }"
              [matTooltip]="'composer.removeFile' | translate: { name: preview.name }">
        <mat-icon>close</mat-icon>
      </button>
    </a>
  </div>

  <!-- Main input area with textarea (hidden during recording) -->
  <div class="input-content-area" *ngIf="!isRecording">
    <textarea #messageTextarea
              [(ngModel)]="messageText"
              (input)="onTextareaInput()"
              (keydown)="handleKeyPress($event)"
              class="message-textarea"
              [placeholder]="'Type your message...' | translate"
              rows="1"
              [attr.aria-label]="'composer.message' | translate">
    </textarea>
  </div>

  <!-- Voice recording info area (shown during recording) -->
  <div class="voice-recording-info" *ngIf="isRecording">
    <!-- Cancel recording button -->
    <button mat-icon-button
            class="cancel-recording-button"
            (click)="cancelRecording()"
            [attr.aria-label]="'composer.cancelRecording' | translate"
            [matTooltip]="'composer.cancelRecording' | translate">
      <mat-icon>close</mat-icon>
    </button>
    <!-- Recording indicator -->
    <div class="recording-indicator" role="timer" [attr.aria-label]="'composer.recording' | translate">
      <span class="recording-dot"></span>
      <span class="recording-time">{{ recordingTime | date:'mm:ss' }}</span>
    </div>
    <!-- Send voice message button -->
    <button mat-icon-button
            class="send-voice-button"
            (click)="sendVoiceMessage()"
            [attr.aria-label]="'composer.sendVoice' | translate"
            [matTooltip]="'composer.sendVoice' | translate">
      <mat-icon>send</mat-icon>
    </button>
  </div>

  <!-- Action buttons bar at the bottom -->
  <div class="action-buttons-bar" *ngIf="!isRecording">
    <!-- Left side buttons -->
    <div class="left-actions">
      <!-- Camera button (only shown if device has camera and is a mobile device) - using label for direct camera access -->
      <label *ngIf="hasCamera && isMobile"
             for="cameraInputId"
             class="action-button camera-button camera-label"
             [attr.aria-label]="'composer.takePhoto' | translate"
             [matTooltip]="'composer.takePhoto' | translate">
        <mat-icon>photo_camera</mat-icon>
      </label>
      <!-- File attachment button with menu -->
      <button mat-icon-button
              class="action-button attachment-button"
              [matMenuTriggerFor]="attachmentMenu"
              [attr.aria-label]="'composer.attach' | translate"
              [matTooltip]="'composer.attach' | translate">
        <mat-icon>attach_file</mat-icon>
      </button>
      <!-- Attachment menu -->
      <mat-menu #attachmentMenu="matMenu" class="attachment-menu">
        <!-- Camera option (only shown if device has camera) - using label for mobile, button for desktop -->
        <label *ngIf="hasCamera && isMobile" mat-menu-item for="cameraInputId" class="file-upload-label">
          <mat-icon>photo_camera</mat-icon>
          <span>{{ 'composer.takePhoto' | translate }}</span>
        </label>
        <button *ngIf="hasCamera && !isMobile" mat-menu-item (click)="handleFileMenuClick('camera')">
          <mat-icon>photo_camera</mat-icon>
          <span>{{ 'composer.takePhoto' | translate }}</span>
        </button>
        <!-- File upload option - using label to preserve trusted user gesture -->
        <label mat-menu-item for="fileInputId" class="file-upload-label">
          <mat-icon>folder_open</mat-icon>
          <span>{{ 'composer.chooseFile' | translate }}</span>
        </label>
        <!-- Location option (only shown if device supports geolocation) -->
        <button *ngIf="hasGeolocation" mat-menu-item (click)="handleFileMenuClick('location')">
          <mat-icon>location_on</mat-icon>
          <span>{{ 'composer.shareLocation' | translate }}</span>
        </button>
      </mat-menu>

      <!-- Extra composer tools from the parent (model and persona picker) -->
      <ng-content select="[composerTools]"></ng-content>
    </div>

    <!-- Right side buttons -->
    <div class="right-actions">
      <!-- Send button when there's content -->
      <button
        *ngIf="hasContent"
        mat-icon-button
        class="action-button send-button"
        (click)="sendMessage()"
        [attr.aria-label]="'composer.send' | translate"
        [matTooltip]="'composer.send' | translate">
        <mat-icon>send</mat-icon>
      </button>

      <!-- Stop button when AI is streaming -->
      <button
        *ngIf="!hasContent && isStreaming"
        mat-icon-button
        class="action-button stop-button"
        (click)="stopRequested.emit()"
        [attr.aria-label]="'composer.stop' | translate"
        [matTooltip]="'composer.stop' | translate">
        <mat-icon>stop</mat-icon>
      </button>

      <!-- Microphone button when input is empty and not streaming -->
      <button
        *ngIf="!hasContent && !isStreaming"
        mat-icon-button
        class="action-button mic-button"
        (click)="startRecording()"
        (touchstart)="onMicTouchStart($event)"
        (touchend)="onMicTouchEnd($event)"
        (mousedown)="onMicMouseDown($event)"
        (mouseup)="onMicMouseUp($event)"
        (mouseleave)="onMicMouseLeave($event)"
        [attr.aria-label]="'composer.record' | translate"
        [matTooltip]="'composer.record' | translate">
        <mat-icon>mic</mat-icon>
      </button>
    </div>
  </div>

  <!-- Hidden file input -->
  <input
    #fileInput
    id="fileInputId"
    type="file"
    (change)="handleFileSelection($event)"
    multiple
    accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"
    style="display: none;">

  <!-- Hidden camera input (for mobile camera capture) -->
  <input
    #cameraInput
    id="cameraInputId"
    type="file"
    accept="image/*"
    capture="environment"
    (change)="handleFileSelection($event)"
    style="display: none;">

</div>
