<div class="chat-ui-container">
  <div class="message-container" #messageContainer (scroll)="onScroll($event)">
    <div class="loading-older-messages" *ngIf="isLoadingOlderMessages" role="status">
      <mat-spinner diameter="30" aria-hidden="true"></mat-spinner>
      <span>{{ 'message.loadingOlder' | translate }}</span>
    </div>
    <!-- A new conversation: a short greeting instead of an empty page -->
    <div class="empty-state" *ngIf="showEmptyState$ | async">
      <div class="empty-state-content">
        <span class="empty-state-icon" aria-hidden="true"><mat-icon>forum</mat-icon></span>
        <h2 class="empty-state-title">{{ 'message.emptyTitle' | translate }}</h2>
        <p class="empty-state-hint">{{ 'message.emptyHint' | translate }}</p>
      </div>
    </div>
    <!-- Manual editing: the system prompt the next answer gets, as the conversation's first message -->
    <app-system-prompt *ngIf="systemPrompt$ | async as systemPrompt" [prompt]="systemPrompt"
                       [busy]="systemPromptBusy" [failed]="systemPromptFailed"
                       (save)="saveSystemPrompt($event)"></app-system-prompt>
    <ng-container *ngIf="{ divider: summaryDivider$ | async } as view">
      <ng-container *ngFor="let message of messages | async; let i = index">
        <app-chat-ui-message [message]="message"
                             [isLastAiMessage]="isLastAiMessage(message, i)"
                             (stepsExpanded)="onAgentStepsExpanded($event)"></app-chat-ui-message>
        <!-- From here on the model gets the summary instead of the messages above -->
        <app-chat-ui-summary *ngIf="view.divider && view.divider.afterId === message.id"
                             [summary]="view.divider.summary"></app-chat-ui-summary>
      </ng-container>
    </ng-container>
    <!-- A summary being written at the user's request: it will cover the messages above -->
    <app-chat-ui-summary *ngIf="isSummarizing$ | async" [pending]="true"></app-chat-ui-summary>
    <!-- Streaming message (displayed separately from persisted messages) -->
    <app-chat-ui-message *ngIf="streamingMessage$ | async as streamingMessage"
                         [message]="streamingMessage"
                         [isLastAiMessage]="true"
                         (stepsExpanded)="onAgentStepsExpanded($event)"></app-chat-ui-message>
  </div>
  <!-- Scrolled up: back to the newest message -->
  <div class="scroll-to-bottom-anchor">
    <button *ngIf="showScrollToBottom" type="button" mat-icon-button class="scroll-to-bottom"
            (click)="jumpToBottom()"
            [matTooltip]="'message.scrollToBottom' | translate" matTooltipPosition="above"
            [attr.aria-label]="'message.scrollToBottom' | translate">
      <mat-icon>arrow_downward</mat-icon>
    </button>
  </div>
  <div class="guest-limit-warning" *ngIf="showGuestLimitWarning">
    <p>{{ guestLimitWarningMessage }} <a routerLink="/login">{{ 'message.guestLimitLogin' | translate }}</a></p>
  </div>
  <!-- Privacy notice for models whose provider may keep or train on messages -->
  <div class="untrusted-notice" *ngIf="(effectiveModel$ | async)?.privacyTier === 'untrusted'" role="note">
    <mat-icon aria-hidden="true">report</mat-icon>
    <span>{{ 'catalog.untrustedNotice' | translate }}</span>
  </div>
  <app-chat-ui-inputfield
    [externalFiles]="pendingFiles"
    [isMobile]="isMobileDevice()"
    [isStreaming]="(isStreaming$ | async) ?? false"
    [canGenerate]="(canGenerate$ | async) ?? false"
    [generateContinues]="(generateKind$ | async) === 'continue'"
    [contextSize]="contextSize$ | async"
    [canShowChatFiles]="(hasStoredConversation$ | async) ?? false"
    (chatFilesRequested)="showChatFiles()"
    (generateRequested)="generateAnswer()"
    (messageSent)="onMessageSent($event)"
    (audioRequested)="onAudioRequested()"
    (filesSelected)="onFileRequested($event)"
    (cameraRequested)="onCameraRequested()"
    (locationRequested)="onLocationRequested()"
    (stopRequested)="cancelStreaming()">
    <app-model-picker composerTools></app-model-picker>
  </app-chat-ui-inputfield>
</div>
