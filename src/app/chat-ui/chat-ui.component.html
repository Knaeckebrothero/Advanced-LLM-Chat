<div class="chat-ui-container">
  <!-- Chat UI Header -->
  <div class="message-container" #messageContainer (scroll)="onScroll($event)">
    <!-- Loading spinner for older messages -->
    <div class="loading-older-messages" *ngIf="isLoadingOlderMessages">
      <mat-spinner diameter="30"></mat-spinner>
      <span>Loading older messages...</span>
    </div>
    <!-- End of conversation indicator -->
    <div class="end-of-conversation" *ngIf="(hasReachedEnd$ | async) && !isLoadingOlderMessages">
      <span>Beginning of conversation</span>
    </div>
    <app-chat-ui-message *ngFor="let message of messages | async" [message]="message"></app-chat-ui-message>
  </div>
  <div class="guest-limit-warning" *ngIf="showGuestLimitWarning">
    <p>{{ guestLimitWarningMessage }} Please <a routerLink="/login">login</a> for full access.</p>
  </div>
  <!-- Input field for sending messages -->
  <app-chat-ui-inputfield
    [externalFiles]="pendingFiles"
    [isMobile]="isMobileDevice()"
    (messageSent)="onMessageSent($event)"
    (audioRequested)="onAudioRequested()"
    (filesSelected)="onFileRequested($event)"
    (cameraRequested)="onCameraRequested()"
    (locationRequested)="onLocationRequested()">
  </app-chat-ui-inputfield>
</div>
