<div class="chat-ui-container">
  <div class="message-container" #messageContainer (scroll)="onScroll($event)">
    <div class="loading-older-messages" *ngIf="isLoadingOlderMessages">
      <mat-spinner diameter="30"></mat-spinner>
      <span>Loading older messages...</span>
    </div>
    <ng-container *ngIf="{ divider: summaryDivider$ | async } as view">
      <ng-container *ngFor="let message of messages | async; let i = index">
        <app-chat-ui-message [message]="message"
                             [isLastAiMessage]="isLastAiMessage(message, i)"
                             (stepsExpanded)="onAgentStepsExpanded($event)"></app-chat-ui-message>
        <!-- From here on the model gets the summary instead of the messages above -->
        <app-chat-ui-summary *ngIf="view.divider && view.divider.afterId === message.id"
                             [summary]="view.divider.summary"></app-chat-ui-summary>
      </ng-container>
    </ng-container>
    <!-- Streaming message (displayed separately from persisted messages) -->
    <app-chat-ui-message *ngIf="streamingMessage$ | async as streamingMessage"
                         [message]="streamingMessage"
                         [isLastAiMessage]="true"
                         (stepsExpanded)="onAgentStepsExpanded($event)"></app-chat-ui-message>
  </div>
  <div class="guest-limit-warning" *ngIf="showGuestLimitWarning">
    <p>{{ guestLimitWarningMessage }} Please <a routerLink="/login">login</a> for full access.</p>
  </div>
  <!-- Privacy notice for models whose provider may keep or train on messages -->
  <div class="untrusted-notice" *ngIf="(effectiveModel$ | async)?.privacyTier === 'untrusted'" role="note">
    <mat-icon aria-hidden="true">report</mat-icon>
    <span>{{ 'catalog.untrustedNotice' | translate }}</span>
  </div>
  <app-chat-ui-inputfield
    [externalFiles]="pendingFiles"
    [isMobile]="isMobileDevice()"
    [isStreaming]="(isStreaming$ | async) ?? false"
    (messageSent)="onMessageSent($event)"
    (audioRequested)="onAudioRequested()"
    (filesSelected)="onFileRequested($event)"
    (cameraRequested)="onCameraRequested()"
    (locationRequested)="onLocationRequested()"
    (stopRequested)="cancelStreaming()">
    <app-model-picker composerTools></app-model-picker>
  </app-chat-ui-inputfield>
</div>
