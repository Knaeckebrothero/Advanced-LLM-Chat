<div class="chat-ui-container">
    <div class="message-container" #messageContainer>
        <app-chat-ui-message *ngFor="let message of messages | async" [message]="message"></app-chat-ui-message>
    </div>
  <div class="input-container">
    <div class="textfield-container">
    <textarea
      [(ngModel)]="inputField"
      class="chat-input"
      rows="1"
      placeholder="Type your message..."
      (input)="adjustTextareaHeight($event)"
      (keydown)="handleEnterKeyPress($event)"
    ></textarea>

      <div class="button-container">
        <button (click)="generateMessage()">G</button>
        <button (click)="inputUserMessage()">S</button>
      </div>
    </div>
  </div>
  <div class="chat-footer-hint">
    KI-generierte Antworten können Fehler enthalten.
    <a href="https://www.frankfurt-university.de/de/impressum/" target="_blank" rel="noopener noreferrer">Impressum</a>
  </div>
</div>
