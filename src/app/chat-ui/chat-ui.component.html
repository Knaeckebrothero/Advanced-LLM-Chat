<div class="chat-ui-container">
  <div class="headbar">
    <img
      *ngIf="!isDarkMode"
      class="headbar-logo"
      src="assets/icons/fra_logo_svg.svg"
      alt="FRA UAS Logo"/>
    <div *ngIf="isDarkMode" class="headbar-logo white-logo"></div>
  </div>

  <div class="selection-bar">
    <div class="selection-dropdowns">
      <button mat-button class="dropdown-button" [matMenuTriggerFor]="roleMenu">
        <mat-icon>school</mat-icon>
        <span>{{ selectedRole === 'student' ? 'Student*in' : 'Lehrender' }}</span>
        <mat-icon>expand_more</mat-icon>
      </button>
      <mat-menu #roleMenu="matMenu" class="custom-menu">
        <button mat-menu-item (click)="setRole('student')">
          <mat-icon>school</mat-icon>
          <span>Student*in</span>
        </button>
        <button mat-menu-item (click)="setRole('teacher')">
          <mat-icon>business_center</mat-icon>
          <span>Teacher</span>
        </button>
      </mat-menu>

      <button mat-button class="dropdown-button" [matMenuTriggerFor]="languageMenu">
        <mat-icon>language</mat-icon>
        <span>{{ selectedLanguage }}</span>
        <mat-icon>expand_more</mat-icon>
      </button>
      <mat-menu #languageMenu="matMenu" class="custom-menu">
        <button mat-menu-item (click)="setLanguage('DE')">
          <span>German</span>
        </button>
        <button mat-menu-item (click)="setLanguage('EN')">
          <span>English</span>
        </button>
      </mat-menu>
    </div>
  </div>

  <div class="message-container" #messageContainer>
    <app-chat-ui-message *ngFor="let message of messages | async" [message]="message"></app-chat-ui-message>
  </div>

  <div class="guest-limit-warning" *ngIf="showGuestLimitWarning">
    <p>{{ guestLimitWarningMessage }} Please <a routerLink="/login">login</a> for full access.</p>
  </div>

  <app-chat-ui-inputfield
    [externalFiles]="pendingFiles"
    [isMobile]="isMobileDevice()"
    (messageSent)="onMessageSent($event)"
    (audioRequested)="onAudioRequested()"
    (filesSelected)="onFileRequested($event)"
    (cameraRequested)="onCameraRequested()"
    (locationRequested)="onLocationRequested()">
  </app-chat-ui-inputfield>
</div>
