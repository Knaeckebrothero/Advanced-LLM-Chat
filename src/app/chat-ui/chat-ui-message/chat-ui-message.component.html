<div class="message-display-container">
  <div class="message" [class.message-user]="message.roleName === 'user'" [class.message-not-user]="message.roleName !== 'user'" [class.message-system]="message.roleName === 'system'">
    <span class="message-user-name">{{ message.roleName }}</span>

    <div class="message-body">
      <div *ngIf="!editing" [innerHTML]="formatMessage(message.content)"></div>
      <div *ngIf="editing" contenteditable="true" class="editable-message" #editableDiv
           [innerText]="message.content!"
           (blur)="updateContent(editableDiv.innerText)">
      </div>
    </div>

    <div class="message-footer">
      <div *ngIf="!editing && message.roleName === 'user'" class="message-actions">
        <button mat-icon-button (click)="editMessage()" aria-label="Edit message">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="insertMessageAbove()" aria-label="Insert message">
          <mat-icon>add</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteMessage()" aria-label="Delete message">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
      <div *ngIf="!editing && message.roleName !== 'user'" class="message-actions">
        <button mat-icon-button (click)="copyMessage()" aria-label="Copy message">
          <mat-icon *ngIf="!copied">content_copy</mat-icon>
          <mat-icon *ngIf="copied">check</mat-icon>
        </button>
        <button mat-icon-button (click)="toggleLike()" [class.liked]="message.liked" aria-label="Like message">
          <mat-icon>thumb_up_off_alt</mat-icon>
        </button>
        <button mat-icon-button (click)="toggleDislike()" [class.disliked]="message.disliked" aria-label="Dislike message">
          <mat-icon>thumb_down_off_alt</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteMessage()" aria-label="Delete message">
          <mat-icon>delete_outline</mat-icon>
        </button>
      </div>
      <div *ngIf="editing" class="message-actions">
        <button mat-icon-button (click)="doneEditing()" aria-label="Done editing">
          <mat-icon>done</mat-icon>
        </button>
        <button mat-icon-button (click)="abortEditing()" aria-label="Abort editing">
          <mat-icon>clear</mat-icon>
        </button>
      </div>
      <span class="message-timestamp">{{ message.time | date:'shortTime' }}</span>
    </div>
  </div>
</div>
