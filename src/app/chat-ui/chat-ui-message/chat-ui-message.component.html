<!-- Message to be used within the Chat UI component -->
<div class="message-display-container">
  <div class="message"
       [class.message-user]="message.roleName === 'user'"
       [class.message-not-user]="message.roleName !== 'user'"
       [class.message-system]="message.roleName === 'system'"
       [class.message-voice]="message.isVoice()">

    <span class="message-user-name">{{ message.roleName }}</span>

    <div class="message-body">
      <!-- Display formatted message when not editing -->
      <div *ngIf="!editing" [innerHTML]="formatMessage(message)"></div>

      <!-- Edit mode - only for text messages -->
      <div *ngIf="editing && message.isText()"
           contenteditable="true"
           class="editable-message"
           #editableDiv
           [innerText]="message.textContent"
           (blur)="updateContent(editableDiv.innerText)">
      </div>
    </div>

    <div class="message-footer">
      <!-- Buttons for Edit, Regenerate, and Insert something above the message. -->
      <div *ngIf="!editing" class="message-actions">
        <!-- Only show edit button for text messages -->
        <button *ngIf="isEditable"
                mat-icon-button
                (click)="editMessage()"
                aria-label="Edit message">
          <mat-icon>edit</mat-icon>
        </button>
        <!-- Regenerate button - only for AI messages that are the last AI message -->
        <button *ngIf="canRegenerate"
                mat-icon-button
                (click)="regenerateMessage()"
                aria-label="Regenerate message">
          <mat-icon>refresh</mat-icon>
        </button>
        <!-- Rating buttons - only for AI messages -->
        <button *ngIf="message.roleName !== 'user'"
                mat-icon-button
                [class.active-rating]="message.rating === 1"
                (click)="rateMessage(1)"
                aria-label="Thumbs up">
          <mat-icon>thumb_up</mat-icon>
        </button>
        <button *ngIf="message.roleName !== 'user'"
                mat-icon-button
                [class.active-rating]="message.rating === 0"
                (click)="rateMessage(0)"
                aria-label="Thumbs down">
          <mat-icon>thumb_down</mat-icon>
        </button>
        <button mat-icon-button
                (click)="insertMessageAbove()"
                aria-label="Insert message">
          <mat-icon>add</mat-icon>
        </button>
        <button mat-icon-button
                (click)="deleteMessage()"
                aria-label="Delete message">
          <mat-icon>delete</mat-icon>
        </button>
      </div>

      <!-- Edit mode actions -->
      <div *ngIf="editing" class="message-actions">
        <button mat-icon-button
                (click)="doneEditing()"
                aria-label="Done editing">
          <mat-icon>done</mat-icon>
        </button>
        <button mat-icon-button
                (click)="abortEditing()"
                aria-label="Abort editing">
          <mat-icon>clear</mat-icon>
        </button>
      </div>

      <span class="message-timestamp">{{ message.time | date:'shortTime' }}</span>
    </div>
  </div>
</div>
