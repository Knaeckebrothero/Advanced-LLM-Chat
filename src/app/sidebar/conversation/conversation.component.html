<div class="conversation-container">
  <button class="conversation-button" [class.active]="highlighted" (click)="onSelect()">
    <div *ngIf="!editing">{{ conversation.name }}</div>
    <input *ngIf="editing"
           [(ngModel)]="newName"
           (blur)="finishEditing()"
           (keyup.enter)="finishEditing()"
           (keyup.escape)="cancelEditing()">
  </button>
  <button *ngIf="editing" class="delete-button" (click)="deleteConversation()">
    <span class="delete-icon">×</span>
  </button>
</div>
