<div class="conversation-container" [class.active]="highlighted" [class.menu-open]="trigger.menuOpen">
  <button class="conversation-button"
          [class.active]="highlighted"
          [attr.aria-current]="highlighted ? 'page' : null"
          (click)="onSelect()"
          (mousedown)="onPressStart($event)"
          (mouseup)="onPressEnd()"
          (touchstart)="onPressStart($event)"
          (touchend)="onPressEnd()">
    <div class="conversation-content">
      <span *ngIf="!editing" [title]="conversation.name">{{ conversation.name }}</span>
      <input *ngIf="editing"
             #editInput
             class="edit-input"
             [(ngModel)]="newName"
             (blur)="finishEditing()"
             (keyup.enter)="finishEditing()"
             (keyup.escape)="cancelEditing()"
             (click)="$event.stopPropagation()">
    </div>
  </button>
  
  <button mat-icon-button
          class="options-button"
          [matMenuTriggerFor]="menu"
          #trigger="matMenuTrigger"
          [attr.aria-label]="'conversationMenu.options' | translate"
          [title]="'conversationMenu.options' | translate"
          (click)="onMenuClick($event)">
    <mat-icon>more_vert</mat-icon>
  </button>
  
  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="onRename()">
      <mat-icon>edit</mat-icon>
      <span>{{ 'conversationMenu.rename' | translate }}</span>
    </button>
    <button mat-menu-item (click)="exportConversation()">
      <mat-icon>download</mat-icon>
      <span>{{ 'conversationMenu.export' | translate }}</span>
    </button>
    <button mat-menu-item [disabled]="summarizing" (click)="summarizeConversation()"
            [title]="'conversationMenu.summarizeHint' | translate">
      <mat-icon>summarize</mat-icon>
      <span>{{ (summarizing ? 'conversationMenu.summarizing' : 'conversationMenu.summarize') | translate }}</span>
    </button>
    <button mat-menu-item *ngIf="hasMemory" [disabled]="reviewingMemory" (click)="reviewMemory()"
            [title]="'conversationMenu.memoryHint' | translate">
      <mat-icon>psychology</mat-icon>
      <span>{{ (reviewingMemory ? 'conversationMenu.memorySaving' : 'conversationMenu.memory') | translate }}</span>
    </button>
    <button mat-menu-item (click)="deleteConversation()">
      <mat-icon>delete</mat-icon>
      <span>{{ 'conversationMenu.delete' | translate }}</span>
    </button>
  </mat-menu>
</div>
