<div class="sidebar">
  <div class="logo">
    <img ngSrc="assets/icons/light-mode-robot.svg" alt="Logo" height="144" width="349"/>
  </div>

  <button class="new-conversation-button"
          [class.highlighted]="(activeConversationId$ | async) === 0"
          (click)="createNewConversation()">
    <mat-icon>add</mat-icon>
    New Chat
  </button>

  <div class="conversation-list">
    <ng-container *ngFor="let label of ['Heute', 'Letzte 7 Tage', 'Diesen Monat', 'Älter']">
      <ng-container *ngIf="groupedConversations[label]?.length">
        <div class="group-label">{{ label }}</div>
        <app-conversation
          *ngFor="let conv of groupedConversations[label]"
          [conversation]="conv"
          [highlighted]="(activeConversationId$ | async) === conv.id"
          (selected)="onSelectConversation($event)">
        </app-conversation>
      </ng-container>
    </ng-container>
  </div>

  <div class="sidebar-navigation-main-links">
    <button class="nav-button" (click)="navigateTo('/')" [class.selected]="router.isActive('/', {paths: 'exact', queryParams: 'exact', fragment: 'ignored', matrixParams: 'ignored'})">
      Chat
    </button>
    <button class="nav-button" (click)="navigateTo('/metrics')" [class.selected]="router.isActive('/metrics', {paths: 'exact', queryParams: 'exact', fragment: 'ignored', matrixParams: 'ignored'})">
      Metrics
    </button>
  </div>

  <!-- User profile section - now clickable for login/logout -->
  <div class="user-with-settings">
    <button class="user-button" (click)="handleUserClick()">
      <div class="avatar">{{ getUserInitials() }}</div>
      <div class="username">{{ getUserName() }}</div>
    </button>
    <button class="settings-icon-button" mat-icon-button (click)="openSettings()">
      <mat-icon>settings</mat-icon>
    </button>
  </div>
</div>
