<div class="sidebar" *ngIf="{ selectedId: selectedConversationId$ | async, path: currentPath$ | async } as view">
  <div class="sidebar-header">
    <!-- With FAMILY_MODE_SWITCH=logo, five quick taps on the logo turn family mode off and on; while it is off,
         the logo wears sunglasses -->
    <div class="brand" (click)="onLogoTap()">
      <span class="brand-logo" [class.pulse]="logoPulse">
        <mat-icon class="brand-mark" aria-hidden="true">forum</mat-icon>
        <svg *ngIf="showingHidden$ | async" class="brand-shades" viewBox="0 0 24 24" aria-hidden="true">
          <!-- On the front speech bubble of the icon (it spans 2..17 x 2..13 of the 24px grid) -->
          <path class="frame" d="M3 5.4h13.2v.9H3z"/>
          <path class="frame" d="M3.5 6h5.4v1.5c0 1.25-.95 2-2.3 2H5.7c-1.3 0-2.2-.8-2.2-2z"/>
          <path class="frame" d="M10.3 6h5.4v1.5c0 1.2-.9 2-2.2 2h-.9c-1.35 0-2.3-.75-2.3-2z"/>
          <rect class="glint" x="4.3" y="6.6" width="1.4" height=".55" rx=".27"/>
          <rect class="glint" x="11.1" y="6.6" width="1.4" height=".55" rx=".27"/>
        </svg>
      </span>
      <span class="brand-name">LLM Chat</span>
    </div>
    <button class="sidebar-close-btn" (click)="closeSidebar()"
      [attr.aria-label]="'sidebar.close' | translate" [title]="'sidebar.close' | translate">
      <mat-icon>chevron_left</mat-icon>
    </button>
  </div>

  <button class="new-conversation-button" [class.highlighted]="view.selectedId === '0'"
    [attr.aria-current]="view.selectedId === '0' ? 'page' : null"
    (click)="createNewConversation()">
    <mat-icon>add</mat-icon>
    {{ 'New Chat' | translate }}
  </button>

  <div class="conversation-list">
    <ng-container *ngFor="let label of ['Today', 'Last 7 Days', 'This Month', 'Older']">
      <ng-container *ngIf="groupedConversations[label]?.length">
        <div class="group-label">{{ label | translate }}</div>
        <app-conversation *ngFor="let conv of groupedConversations[label]" [conversation]="conv"
          [highlighted]="view.selectedId === conv.id" (selected)="onSelectConversation($event)">
        </app-conversation>
      </ng-container>
    </ng-container>
  </div>

  <nav class="sidebar-navigation-main-links">
    <button class="nav-button" (click)="navigateTo('/')" [class.selected]="isNavActive(view.path, '/')"
      [attr.aria-current]="isNavActive(view.path, '/') ? 'page' : null">
      <mat-icon aria-hidden="true">chat</mat-icon>
      <span>{{ 'Chat' | translate }}</span>
    </button>
    <button *ngIf="isMember$ | async" class="nav-button" (click)="navigateTo('/knowledge-base')"
      [class.selected]="isNavActive(view.path, '/knowledge-base')"
      [attr.aria-current]="isNavActive(view.path, '/knowledge-base') ? 'page' : null">
      <mat-icon aria-hidden="true">menu_book</mat-icon>
      <span>{{ 'knowledgeBase.title' | translate }}</span>
    </button>
    <button *ngIf="isMember$ | async" class="nav-button" (click)="navigateTo('/mcp')"
      [class.selected]="isNavActive(view.path, '/mcp')"
      [attr.aria-current]="isNavActive(view.path, '/mcp') ? 'page' : null">
      <mat-icon aria-hidden="true">extension</mat-icon>
      <span>{{ 'mcp.title' | translate }}</span>
    </button>
    <button *ngIf="isAdmin$ | async" class="nav-button" (click)="navigateTo('/agents')"
      [class.selected]="isNavActive(view.path, '/agents')"
      [attr.aria-current]="isNavActive(view.path, '/agents') ? 'page' : null">
      <mat-icon aria-hidden="true">smart_toy</mat-icon>
      <span>{{ 'Agents' | translate }}</span>
    </button>
  </nav>

  <!-- The user: a guest logs in from here, a signed-in user logs out -->
  <div class="user-with-settings">
    <button class="user-button" (click)="handleUserClick()"
      [title]="getUserName() + ' · ' + ((isGuest() ? 'Login' : 'Logout') | translate)">
      <div class="avatar" aria-hidden="true">{{ getUserInitials() }}</div>
      <div class="username">{{ getUserName() }}</div>
    </button>
    <button class="settings-icon-button" (click)="openSettings()"
      [attr.aria-label]="'Settings' | translate" [title]="'Settings' | translate">
      <mat-icon>settings</mat-icon>
    </button>
  </div>
</div>
