<div *ngIf="statusService.showSidenav$ | async" class="sidenav">
  <mat-nav-list>
    <!-- Landingpage -->
    <mat-list-item (click)="navigate('/')">
      <h3 matLine>{{ 'Chat' | translate }}</h3>
    </mat-list-item>
    <!-- Metrics -->
    <mat-list-item (click)="navigate('/metrics')">
      <h3 matLine>{{ 'Metrics' | translate }}</h3>
    </mat-list-item>
    <!-- Settings -->
    <mat-list-item (click)="navigate('/settings')">
      <h3 matLine>{{ 'Settings' | translate }}</h3>
    </mat-list-item>
    <!-- Settings -->
    <mat-list-item (click)="logout()">
      <h3 matLine>{{ 'Logout' | translate }}</h3>
    </mat-list-item>
  </mat-nav-list>
</div>
