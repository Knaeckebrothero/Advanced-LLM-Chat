<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>{{ 'Login' | translate }}</mat-card-title>
      <mat-card-subtitle>{{ 'Please enter your email to continue' | translate }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'Email' | translate }}</mat-label>
          <input matInput
                 type="email"
                 [(ngModel)]="email"
                 name="email"
                 [placeholder]="'Email' | translate"
                 (keyup.enter)="login()"
                 [disabled]="loading"
                 required
          >
          <mat-error *ngIf="!email">
            {{ 'Email is required' | translate }}
          </mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="error">
          <mat-icon color="warn">error</mat-icon>
          <span>{{ error }}</span>
        </div>

        <button
          mat-raised-button
          color="secondary"
          (click)="login()"
          [disabled]="loading || !email"
          class="full-width login-button"
        >
          <span *ngIf="!loading">{{ 'Login' | translate }}</span>
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
