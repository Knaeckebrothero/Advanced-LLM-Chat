<div class="settings-container" *ngIf="settings$ | async as settings">
  <h2>Settings</h2>

  <div class="setting-option">
    <label>Theme</label>
    <div class="options-group">
      <button
        *ngFor="let option of themeOptions"
        class="option-button"
        [class.active]="settings.theme === option.value"
        (click)="updateTheme(option.value)"
      >
        <mat-icon>{{ option.icon }}</mat-icon>
        <span>{{ option.label }}</span>
      </button>
    </div>
  </div>

  <div class="setting-option">
    <label>Language</label>
    <div class="options-group">
      <button
        *ngFor="let option of languageOptions"
        class="option-button"
        [class.active]="settings.language === option.value"
        (click)="updateLanguage(option.value)"
      >
        <span>{{ option.label }}</span>
      </button>
    </div>
  </div>
</div>
