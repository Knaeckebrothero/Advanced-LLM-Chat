<div class="settings-container">
  <h2>Einstellungen</h2>

  <div class="toggles-row">
    <div class="dark-mode-toggle">
      <label class="toggle-switch">
        <input type="checkbox" [ngModel]="settings.theme !== 'light'" (ngModelChange)="toggleTheme()" />
        <span class="slider">
          <mat-icon class="icon">{{ getThemeIcon() }}</mat-icon>
        </span>
      </label>
    </div>

    <div class="language-toggle">
      <label class="language-switch">
        <input type="checkbox" [ngModel]="settings.language === 'en'" (ngModelChange)="toggleLanguage()" />
        <span class="slider">
          <span class="lang-label">{{ settings.language === 'en' ? 'EN' : 'DE' }}</span>
        </span>
      </label>
    </div>
  </div>

  <div class="button-row">
    <button mat-stroked-button color="primary" (click)="resetSettings()">Zurücksetzen</button>
    <button mat-flat-button color="primary" (click)="closeAndSave()">Speichern</button>
  </div>
</div>
