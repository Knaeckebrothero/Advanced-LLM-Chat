<div class="settings-container" *ngIf="settings$ | async as settings">
  <h2>{{ 'Settings' | translate }}</h2>

  <div class="setting-option">
    <label>{{ 'Theme' | translate }}</label>
    <div class="options-group">
      <button
        *ngFor="let option of themeOptions"
        class="option-button"
        [class.active]="settings.theme === option.value"
        (click)="updateTheme(option.value)"
        [attr.aria-pressed]="settings.theme === option.value"
      >
        <mat-icon>{{ option.icon }}</mat-icon>
        <span>{{ option.label | translate }}</span>
      </button>
    </div>
  </div>

  <div class="setting-option">
    <label>{{ 'Language' | translate }}</label>
    <div class="options-group">
      <button
        *ngFor="let option of languageOptions"
        class="option-button"
        [class.active]="settings.language === option.value"
        (click)="updateLanguage(option.value)"
        [attr.aria-pressed]="settings.language === option.value"
      >
        <span>{{ option.label }}</span>
      </button>
    </div>
  </div>

  <!-- Default model for new conversations (only with a model catalog) -->
  <ng-container *ngIf="(models$ | async) as models">
    <div class="setting-option" *ngIf="models.length > 0">
      <label id="default-model-label">{{ 'catalog.settings.defaultModel' | translate }}</label>
      <app-model-select
        class="default-model-select"
        variant="field"
        [models]="models"
        [selectedId]="selectedDefaultModel(settings, models)"
        [automaticLabel]="'catalog.settings.automatic' | translate"
        [automaticHint]="'catalog.settings.automaticHint' | translate"
        (selectedChange)="updateDefaultModel($event)">
      </app-model-select>
      <p class="setting-hint">{{ 'catalog.settings.defaultModelHint' | translate }}</p>
    </div>
  </ng-container>

  <!-- Catalog management for admins -->
  <div class="setting-option" *ngIf="isAdmin$ | async">
    <label>{{ 'catalog.settings.catalog' | translate }}</label>
    <button class="manage-button" (click)="openCatalogAdmin()">
      <mat-icon>tune</mat-icon>
      <span>{{ 'catalog.settings.manageCatalog' | translate }}</span>
      <mat-icon class="manage-button-arrow">chevron_right</mat-icon>
    </button>
  </div>

  <div class="button-row">
    <button class="done-button" (click)="close()">{{ 'Done' | translate }}</button>
  </div>
</div>
