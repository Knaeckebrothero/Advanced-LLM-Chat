<div class="settings-container">
  <h2>Einstellungen</h2>

  <!-- Toggle-Leiste -->
  <div class="toggles-row">
    <!-- Dark Mode Toggle -->
    <div class="dark-mode-toggle">
      <label class="toggle-switch">
        <input type="checkbox" [(ngModel)]="settings.darkMode" (change)="toggleTheme()" />
        <span class="slider">
          <mat-icon class="icon">{{ getThemeIcon() }}</mat-icon>
        </span>
      </label>
    </div>

    <!-- Language Toggle  -->
    <div class="language-toggle">
      <label class="language-switch">
        <input type="checkbox" [(ngModel)]="settings.languageIsEnglish" (change)="toggleLanguage()" />
        <span class="slider">
          <span class="lang-label">{{ settings.languageIsEnglish ? 'EN' : 'DE' }}</span>
        </span>
      </label>
    </div>
  </div>

  <!-- Modell -->
  <label for="model">Modell</label>
  <select id="model" [(ngModel)]="settings.model" class="custom-input">
    <option *ngFor="let m of models" [value]="m">{{ m }}</option>
  </select>

  <!-- Temperature -->
  <label for="temperature">Temperature</label>
  <select id="temperature" [(ngModel)]="settings.temperature" class="custom-input">
    <option *ngFor="let t of temperatures" [value]="t">{{ t }}</option>
  </select>

  <!-- Top_p -->
  <label for="top_p">Top_p</label>
  <select id="top_p" [(ngModel)]="settings.top_p" class="custom-input">
    <option *ngFor="let p of topPValues" [value]="p">{{ p }}</option>
  </select>

  <!-- System Prompt -->
  <label for="prompt">System Prompt</label>
  <textarea id="prompt" [(ngModel)]="settings.systemPrompt" rows="4" class="custom-input"></textarea>


  <div class="button-row">
    <button mat-stroked-button color="primary" (click)="resetSettings()">Zurücksetzen</button>
    <button mat-flat-button color="primary" (click)="closeAndSave()">Speichern</button>
  </div>
</div>
