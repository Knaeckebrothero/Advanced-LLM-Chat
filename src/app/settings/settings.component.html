<div class="settings-panel">

  <div class="settings-header">
    <h2 class="settings-title">Einstellungen</h2>
    <button mat-icon-button (click)="cancel()" class="close-button" aria-label="Close settings">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="settings-content">
    <div class="settings-grid">

      <label class="grid-label">Farbschema</label>
      <div class="segmented-control">
        <input type="radio" id="theme-light" name="theme" value="light" [(ngModel)]="settings.theme" (ngModelChange)="onThemeChange()">
        <label for="theme-light"><mat-icon>light_mode</mat-icon></label>

        <input type="radio" id="theme-dark" name="theme" value="dark" [(ngModel)]="settings.theme" (ngModelChange)="onThemeChange()">
        <label for="theme-dark"><mat-icon>dark_mode</mat-icon></label>

        <input type="radio" id="theme-os" name="theme" value="os" [(ngModel)]="settings.theme" (ngModelChange)="onThemeChange()">
        <label for="theme-os"><mat-icon>brightness_auto</mat-icon></label>
      </div>

    </div>

    <div class="info-links">
      <a class="info-link" href="#" (click)="$event.preventDefault()">
        <span>Über Recycling Bot</span>
        <mat-icon>arrow_forward</mat-icon>
      </a>
      <a class="info-link" href="#" (click)="$event.preventDefault()">
        <span>Leitfaden zum Umgang mit Recycling Bot</span>
        <mat-icon>arrow_forward</mat-icon>
      </a>
    </div>

  </div>

  <div class="settings-footer">
    <button mat-flat-button color="primary" (click)="closeAndSave()">Save</button>
  </div>
</div>
