<div class="main-ui-container">
  <div class="app-header" *ngIf="isAuthenticated">
    <mat-icon aria-hidden="false" aria-label="Menu icon" fontIcon="menu" (click)="toggleNavbar()"></mat-icon>
    <span class="spacer"></span>
    <button mat-icon-button (click)="logout()" aria-label="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
  <app-status-bar *ngIf="isAuthenticated"></app-status-bar>
  <router-outlet></router-outlet>
</div>
