<div class="app-container">
  <!-- Backdrop overlay for mobile (when sidebar is open) -->
  <div *ngIf="showMenuIcon" class="sidebar-backdrop" [class.visible]="uiState.sidebarOpen$ | async"
    (click)="uiState.toggleSidebar()">
  </div>

  <!-- Sidebar toggle button - visible when sidebar is closed -->
  <button *ngIf="showMenuIcon && !(uiState.sidebarOpen$ | async)" class="sidebar-toggle-btn sidebar-toggle-btn--open"
    (click)="uiState.toggleSidebar()" aria-label="Open sidebar">
    <mat-icon>menu</mat-icon>
  </button>

  <app-sidebar *ngIf="showMenuIcon" class="sidebar-element" [class.open]="uiState.sidebarOpen$ | async">
  </app-sidebar>

  <div class="content-wrapper" [class.sidebar-open]="(uiState.sidebarOpen$ | async) && showMenuIcon"
    [class.no-sidebar]="!showMenuIcon">
    <router-outlet></router-outlet>
  </div>
</div>
