version: '3.8'

services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-knaeckebrothero/advanced-llm-chat}-frontend:${TAG:-develop-latest}
    container_name: advanced-llm-chat-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-knaeckebrothero/advanced-llm-chat}-backend:${TAG:-develop-latest}
    container_name: advanced-llm-chat-backend
    ports:
      - "${BACKEND_PORT:-8443}:8443"
    restart: unless-stopped
    environment:
      - USE_DEV_CERTS=True
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
    volumes:
      - ./data:/app/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

