version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fessi-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fessi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fessi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-fessi_chat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fessi} -d ${POSTGRES_DB:-fessi_chat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15-community
    container_name: fessi-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-fessi_neo4j_dev}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  db-init:
    image: ghcr.io/${GITHUB_REPOSITORY:-knaeckebrothero/fessi}-backend:${TAG:-develop-latest}
    container_name: fessi-db-init
    command: ["python", "-m", "backend.app_init", "--seed"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-fessi_chat}
      - POSTGRES_USER=${POSTGRES_USER:-fessi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fessi_dev_password}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-fessi_neo4j_dev}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-knaeckebrothero/fessi}-frontend:${TAG:-develop-latest}
    container_name: fessi-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-knaeckebrothero/fessi}-backend:${TAG:-develop-latest}
    container_name: fessi-backend
    ports:
      - "${BACKEND_PORT:-8443}:8443"
    restart: unless-stopped
    environment:
      - USE_DEV_CERTS=True
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-fessi_chat}
      - POSTGRES_USER=${POSTGRES_USER:-fessi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fessi_dev_password}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-fessi_neo4j_dev}
    volumes:
      - filesystem_data:/app/.filesystem
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  filesystem_data:
