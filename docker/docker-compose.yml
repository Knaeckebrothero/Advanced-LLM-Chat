version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fessi-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=fessi
      - POSTGRES_PASSWORD=fessi_dev_password
      - POSTGRES_DB=fessi_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fessi -d fessi_chat"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: fessi-frontend:latest
    container_name: fessi-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
    image: fessi-backend:latest
    container_name: fessi-backend
    ports:
      - "8443:8443"
    restart: unless-stopped
    environment:
      - USE_DEV_CERTS=True
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fessi_chat
      - POSTGRES_USER=fessi
      - POSTGRES_PASSWORD=fessi_dev_password
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

