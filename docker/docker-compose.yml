version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-chat-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=llm_chat
      - POSTGRES_PASSWORD=llm_chat_dev_password
      - POSTGRES_DB=llm_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_chat -d llm_chat"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15-community
    profiles: ["graph"]  # optional: start with --profile graph
    container_name: llm-chat-neo4j
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/llm_chat_neo4j_dev
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  db-init:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
    container_name: llm-chat-db-init
    command: ["python", "-m", "backend.app_init", "--seed"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=llm_chat
      - POSTGRES_USER=llm_chat
      - POSTGRES_PASSWORD=llm_chat_dev_password
      # Seeds the model catalog (empty MODEL_CATALOG_FILE = no seeding); providers whose
      # key variable is unset start disabled. Existing models and agents are never overwritten.
      - MODEL_CATALOG_FILE=${MODEL_CATALOG_FILE-catalog/models.json}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CORTECS_API_KEY=${CORTECS_API_KEY:-}
      - MODEL_ROUTER_API=${MODEL_ROUTER_API:-}
      - MODEL_ROUTER_KEY=${MODEL_ROUTER_KEY:-}
      - NEO4J_ENABLED=${NEO4J_ENABLED:-false}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=llm_chat_neo4j_dev
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
        required: false
    networks:
      - app-network
    restart: "no"

  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: llm-chat-frontend:latest
    container_name: llm-chat-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL:-https://localhost:8443}
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
    image: llm-chat-backend:latest
    container_name: llm-chat-backend
    ports:
      - "8443:8443"
    restart: unless-stopped
    environment:
      # SSL/TLS
      - USE_DEV_CERTS=True
      # Reverse proxy whose X-Forwarded-For header is trusted (guest rate limit by IP)
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=llm_chat
      - POSTGRES_USER=llm_chat
      - POSTGRES_PASSWORD=llm_chat_dev_password
      # Neo4j
      - NEO4J_ENABLED=${NEO4J_ENABLED:-false}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=llm_chat_neo4j_dev
      # LLM Provider (uncomment and configure as needed)
      # - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      # Model catalog (docs/model_catalog_api.md)
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - CORTECS_API_KEY=${CORTECS_API_KEY:-}
      - MODEL_ROUTER_API=${MODEL_ROUTER_API:-}
      - MODEL_ROUTER_KEY=${MODEL_ROUTER_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Vision/Multimodal
      - MODEL_RECEIVE_IMAGES=${MODEL_RECEIVE_IMAGES:-false}
      - MODEL_RECEIVE_IMAGES_PDF=${MODEL_RECEIVE_IMAGES_PDF:-false}
      - VISION_BASE_URL=${VISION_BASE_URL:-}
      - VISION_MODEL=${VISION_MODEL:-gpt-4o-mini}
      # Audio Transcription
      - USE_LOCAL_WHISPER=${USE_LOCAL_WHISPER:-false}
      - LOCAL_WHISPER_MODEL=${LOCAL_WHISPER_MODEL:-base}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/.filesystem
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
