worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # Content Security Policy
        # Note: This should match the backend CSP for consistency
        set $csp "default-src 'self'; ";
        set $csp "${csp}script-src 'self' 'unsafe-inline' 'unsafe-eval'; ";
        set $csp "${csp}style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; ";
        set $csp "${csp}font-src 'self' https://fonts.gstatic.com; ";
        set $csp "${csp}img-src 'self' data: blob:; ";
        set $csp "${csp}connect-src 'self' wss: https:; ";
        set $csp "${csp}frame-ancestors 'none'; ";
        set $csp "${csp}base-uri 'self'; ";
        set $csp "${csp}form-action 'self'";
        add_header Content-Security-Policy $csp always;

        # Handle Angular routes - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Service worker
        location /ngsw-worker.js {
            add_header Cache-Control "no-cache";
            expires off;
        }

        # Manifest
        location /manifest.webmanifest {
            add_header Content-Type "application/manifest+json";
        }
    }
}
