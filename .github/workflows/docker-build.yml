name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment artifacts
        run: |
          mkdir -p deployment
          cp docker/docker-compose.yml deployment/
          echo "IMAGE_TAG=${{ steps.meta.outputs.version }}" > deployment/.env
          echo "# Deployment Instructions" > deployment/README.md
          echo "" >> deployment/README.md
          echo "## Pull and run the latest image:" >> deployment/README.md
          echo "\`\`\`bash" >> deployment/README.md
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-latest" >> deployment/README.md
          echo "docker run -d -p 8080:80 --name advanced-llm-chat ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-latest" >> deployment/README.md
          echo "\`\`\`" >> deployment/README.md
          echo "" >> deployment/README.md
          echo "## Or use docker-compose:" >> deployment/README.md
          echo "\`\`\`bash" >> deployment/README.md
          echo "docker-compose up -d" >> deployment/README.md
          echo "\`\`\`" >> deployment/README.md

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deployment-artifacts
          path: deployment/
