name: Build and Publish

# develop: images tagged develop-latest and sha-<commit>, the chart is checked.
# main (every merge is a release): images tagged <version>, latest and main, the Helm chart
# pushed to oci://ghcr.io/<owner>/charts/advanced-llm-chat, and a GitHub release v<version>
# with the chart and the docker compose bundle.
# Pull requests: everything is built and checked, nothing is published.

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_DIR: helm/advanced-llm-chat

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # <major>.<minor> from Chart.yaml and the run number, so every release has its own version
      - name: Determine the version
        id: version
        run: |
          base=$(awk '/^version:/ {print $2}' "$CHART_DIR/Chart.yaml")
          version="$(echo "$base" | cut -d. -f1-2).${{ github.run_number }}"
          release=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version (release: $release)"

  build-and-push-frontend:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=${{ github.event_name == 'pull_request' && 'pr-' || 'sha-' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-backend:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=${{ github.event_name == 'pull_request' && 'pr-' || 'sha-' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-chart:
    # Published after the images it points to
    needs: [version, build-and-push-frontend, build-and-push-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.0

      - name: Lint and render the chart
        run: |
          helm lint "$CHART_DIR"
          helm template check "$CHART_DIR" > /dev/null
          helm template check "$CHART_DIR" --set keycloak.enabled=true --set ingress.enabled=true > /dev/null
          helm template check "$CHART_DIR" --set auth.mode=oidc --set auth.oidc.issuer=https://auth.example.com/realms/x \
            --set postgresql.enabled=false --set postgresql.external.host=db --set postgresql.existingSecret=db > /dev/null

      # The chart's version and appVersion (the image tag) are the release version
      - name: Package the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Push the chart to the Container registry
        if: needs.version.outputs.release == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push dist/*.tgz "oci://$REGISTRY/$owner/charts"

      - name: Upload the chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ needs.version.outputs.version }}
          path: dist/
          retention-days: 14

  compose-bundle:
    needs: [version, helm-chart]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # docker-compose.yml with the release's image tag (develop: develop-latest), the
      # optional Keycloak file, its realm and the settings template
      - name: Bundle the docker compose files
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || 'develop-latest' }}
        run: .github/scripts/compose-bundle.sh "$VERSION" "$TAG" dist

      - name: Upload the compose bundle
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-${{ needs.version.outputs.version }}
          path: dist/
          retention-days: 14

      - name: Download the chart
        if: needs.version.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: helm-chart-${{ needs.version.outputs.version }}
          path: dist/

      - name: Create the GitHub release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image=$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --notes "Images: \`$image-frontend:$VERSION\`, \`$image-backend:$VERSION\`.

          Helm: \`helm install chat oci://$REGISTRY/$owner/charts/advanced-llm-chat --version $VERSION -f values.yaml\`

          Docker compose: the \`advanced-llm-chat-compose-$VERSION.tar.gz\` below."
